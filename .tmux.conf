set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-sensible'

setw -g mouse on
set -g base-index 1
setw -g pane-base-index 1

setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

set -g default-terminal 'tmux-256color'
set -g status on
set -g status-interval 5
set -g status-right-length 120
set -g status-right '#{cpu_percentage} #{ram_percentage} #{battery_icon} #{battery_percentage} | %Y-%m-%d %H:%M'
set -g status-style 'bg=black,fg=white'

# Clipboard integration for WSL + Windows Terminal
set -s set-clipboard on
# allow-passthrough is not available on tmux 3.2a
set -ga terminal-features ',xterm-256color:clipboard'
set -ga terminal-features ',tmux-256color:clipboard'

# Copy from tmux copy-mode directly into Windows clipboard
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "clip.exe"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "clip.exe"

run '~/.tmux/plugins/tpm/tpm'
