set -g @plugin 'fabioluciano/tmux-powerkit'

set -g @powerkit_plugins "datetime,battery,cpu,memory,git,hostname"
set -g @powerkit_theme "tokyonight"
set -g @powerkit_theme_variant "night"
set -g @powerkit_transparent "true"
set -g @powerkit_separator_style "normal"
set -g @powerkit_status_position "bottom"

setw -g mouse on
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

set -s set-clipboard on
set -ga terminal-features ',xterm-256color:clipboard'
set -ga terminal-features ',tmux-256color:clipboard'
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "clip.exe"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "clip.exe"

run '~/.tmux/plugins/tpm/tpm'
